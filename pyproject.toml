[project]
name = "GNN-BGI-suitability"
version = "1.0.0"
description = "Suitability assessment of GNN-based metamodels for BGI allocation (Chapter 5 of the PhD thesis Metamodeling of Urban Drainage Systems with Graph Neural Networks)."
authors = [{ name = "Alexander Garzón", email = "j.a.garzondiaz@tudelft.nl" }]
requires-python = ">=3.10,<4"
readme = "README.md"
license = "MIT"
dependencies = [
    # Hydrodynamic model (SWMM)
    "pyswmm>=2.0.0,<3",
    "swmmio>=0.7.1,<0.8",
    "swmmtoolbox>=4.0.14,<5",
    # GNN metamodel (also required by the SWMMMetamodel repository)
    "torch>=2.6.0",
    "torch-geometric>=2.5.3,<3",
    "networkx>=3.4.2",
    "class-resolver>=0.5.4,<0.6",
    "more-itertools>=10.5.0,<11",
    # Data processing and metrics
    "numpy>=2.2.2",
    "pandas>=2.2.1,<3",
    "openpyxl>=3.1.5",
    "pyyaml>=6.0.2",
    "scipy>=1.13.0,<2",
    "scikit-learn>=1.7.1,<2",
    "python-dotenv>=1.0.1,<2",
    # Workflow
    "snakemake>=7.32.4",
    # Figures and notebooks
    "plotly>=6.5.2",
    "kaleido>=1.2.0",
    "nbformat>=5.10.4",
    "ipykernel>=6.29.4,<7",
    "ipywidgets>=8.1.2,<9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "jupyter-black>=0.3.4,<0.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
